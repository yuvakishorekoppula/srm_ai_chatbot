<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SRM AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="srm-logo">SRM</div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchLogin('student')">Student</button>
                <button class="tab-btn" onclick="switchLogin('admin')">Admin</button>
            </div>

            <!-- Student Login Form -->
            <div id="student-login" class="auth-form active">
                <h2>Student Login</h2>
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="your.email@srmist.edu.in">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="auth-btn">Login as Student</button>
                </form>
                <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
            </div>

            <!-- Admin Login Form -->
            <div id="admin-login" class="auth-form">
                <h2>Admin Login</h2>
                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="form-group">
                        <label for="admin-username">Username</label>
                        <input type="text" id="admin-username" name="username" required placeholder="Admin username">
                    </div>
                    <div class="form-group">
                        <label for="admin-password">Password</label>
                        <input type="password" id="admin-password" name="password" required placeholder="••••••••">
                    </div>
                    {% if error %}
                        <p style="color: #ff4444; margin-bottom: 1rem; font-size: 0.85rem;">{{ error }}</p>
                    {% endif %}
                    <button type="submit" class="auth-btn">Login as Admin</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchLogin(type) {
            // Update tabs
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(type + '-login').classList.add('active');
        }
        
        // Auto-switch to admin tab if error exists (likely from admin login attempt)
        {% if error %}
            switchLogin('admin');
            document.querySelectorAll('.tab-btn')[0].classList.remove('active');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
        {% endif %}
    </script>
    </div>
</body>
</html>
